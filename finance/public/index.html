<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c5c">
<title>المتابعة المالية — Elite Skin</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d2a2e;--mut:#6b7a7f;--line:#e4dfd6;--pri:#0f5c5c;--pri2:#e3f0ee;--r:#c8372d;--rb:#fbe6e3;--y:#b7860b;--yb:#fdf3d3;--g:#1f7a4a;--gb:#dff3e7;--ai:#5b3fa6;--aib:#efeafa;--gold:#d9a441}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:210px;background:var(--pri);color:#fff;padding:16px 10px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side h1{font-size:16px;margin:0 8px 2px}
.side small{display:block;margin:0 8px 16px;opacity:.7;font-size:11px}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:right;background:none;border:0;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;opacity:.88;margin-bottom:2px}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:var(--pri);opacity:1;font-weight:600}
.nav .bd{background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.nav.on .bd{background:var(--rb);color:var(--r)}
.side .foot{margin-top:auto;font-size:11px;opacity:.8;padding:8px}
.main{flex:1;padding:20px 24px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;font-size:21px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--pri)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
.btn.ok{background:var(--gb);color:var(--g);border-color:var(--gb);cursor:default}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn:disabled{opacity:.55;cursor:default}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi{cursor:pointer;transition:.15s;position:relative}
.kpi:hover{border-color:var(--pri);transform:translateY(-2px)}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:20px;overflow-wrap:anywhere;font-weight:700;margin:2px 0}
.kpi .d{font-size:12px}
.kpi .go{position:absolute;left:12px;top:12px;color:var(--mut);font-size:12px}
.up{color:var(--g)}.dn{color:var(--r)}.wn{color:var(--y)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero h3{margin:0 0 4px}
.hero .big{font-size:26px;font-weight:700}
.status{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#faf8f4}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600}
.r{background:var(--rb);color:var(--r)}.y{background:var(--yb);color:var(--y)}.g{background:var(--gb);color:var(--g)}
.b{background:var(--pri2);color:var(--pri)}.pu{background:var(--aib);color:var(--ai)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:8px;background:#eee9e0;border-radius:5px;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.gld i{background:var(--gold)}.bar.grn i{background:var(--g)}
.ins{border-right:4px solid var(--ai);background:var(--aib);padding:10px 14px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ins.warn{border-color:var(--r);background:var(--rb)}.ins.good{border-color:var(--g);background:var(--gb)}
.ins b{display:block}
.note{font-size:12px;color:var(--mut)}
.act{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.act:last-child{border-bottom:0}
.act .t{min-width:0;flex:1 1 220px}
.act .t b{display:block}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.plan-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-it:last-child{border-bottom:0}
.plan-it.done .tt{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.chk.on{background:var(--g);border-color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(20,30,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:9}
.mod{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:760px}
.mod .top{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.err{color:var(--r);font-size:12px;margin-top:6px}
.banner{padding:7px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.banner.warn{background:var(--rb);color:var(--r)}.banner.info{background:var(--yb);color:#6b4e00}.banner.ok{background:var(--gb);color:var(--g)}
.chat{max-height:420px;overflow:auto;margin-bottom:10px}
.q{background:var(--pri2);padding:8px 12px;border-radius:10px;margin:8px 0;width:fit-content;max-width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ai);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:20;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font-size:20px;margin:0 0 4px}.login p{margin:0 0 18px;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:10px}
.mcell.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.mcell input{padding:5px 8px;font-size:13px}
.strategy{background:var(--aib);border-radius:10px;padding:12px 14px;margin-bottom:12px;white-space:pre-line}
@media(max-width:900px){.two,.hero{grid-template-columns:1fr}.hero svg{margin:0 auto}.app{flex-direction:column}.side{width:auto;height:auto;padding:8px;position:sticky;top:0;z-index:5}.side h1,.side small,.side .foot{display:none}#nav{display:flex;gap:4px;overflow-x:auto}.nav{width:auto;white-space:nowrap;margin:0;padding:7px 11px;gap:6px}.main{padding:14px 16px 40px}.plan-it{grid-template-columns:auto 1fr}.plan-it .acts{grid-column:1/-1}}
@media print{body{background:#fff}.side,.noprint,.banner{display:none!important}.main{padding:0}.ov{position:static;background:none;padding:0}.mod{max-width:none;padding:0}body.printing .page{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let D=null;
const S={page:'dash',recF:'all',recTab:'clients',chat:[],insights:null,insBusy:false,goalYear:null,salesTab:'months'};

const f=n=>Math.round(n||0).toLocaleString('en-US');
const m$=n=>f(n)+' '+(D?D.currency:'');
const k$=n=>{n=Math.round(n||0);const a=Math.abs(n);return (a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e4?Math.round(n/1e3)+'K':f(n))};
const ml=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const P=x=>x==null?'—':Math.round(x*100)+'%';
const days=d=>Math.floor((new Date(D.today)-new Date(d))/864e5);
const st=d=>{const l=days(d.due);return l>30?'r':l>0?'y':'g'};
const STL={r:'متأخر أكثر من شهر',y:'متأخر أقل من شهر',g:'في موعده'};
const client=id=>(D.clientsList||[]).find(c=>String(c.id)===String(id))||{name:'',phone:''};
const owedBy=id=>D.receivables.filter(d=>String(d.who)===String(id));
const inPlan=(type,id)=>D.plan.items.some(i=>i.type===type&&String(i.clientId)===String(id));
const pcls=x=>x==null?'b':x>=1?'g':x>=.9?'y':'r';

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ===== API ===== */
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts));
  if(r.status===401){location.reload();return}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function loadData(){D=await api('/api/data');if(!S.goalYear)S.goalYear=D.today.slice(0,4)}
async function refresh(){await loadData();render()}
// زر ذكي: يقفل نفسه ويعرض حالة التحميل لحد ما الأمر يخلص
async function busy(btn,label,fn){const old=btn?btn.innerHTML:'';if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+label}
  try{return await fn()}catch(e){toast(e.message)}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=old}}}

/* ===== تواصل ===== */
function intl(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);
  else if(d.length===10&&d.startsWith('05'))d='966'+d.slice(1);else if(d.length===11&&d.startsWith('01'))d='20'+d.slice(1);return d}
function waMsg(kind,id){const c=client(id),list=owedBy(id),tot=list.reduce((s,d)=>s+d.amount,0);
  if(kind==='collect')return `السلام عليكم ${c.name}،\nتذكير ودّي بمستحقات بقيمة ${m$(tot)} (${list.map(d=>d.inv).join('، ')}).\nيسعدنا التواصل لترتيب السداد. شكرًا لتعاونكم 🌿\nElite Skin`;
  return `السلام عليكم ${c.name}،\nوحشتونا! حابين نطمن على احتياجاتكم من منتجات Elite Skin ونرتب لكم الطلبية الجاية.\nمتاحين لأي استفسار 🌿`}
function contactBtns(id,kind){const c=client(id),p=intl(c.phone);if(!p)return '<span class="note">لا يوجد رقم</span>';
  return `<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${p}?text=${encodeURIComponent(waMsg(kind,id))}">واتساب</a><a class="btn sm" href="tel:+${p}">اتصال</a>`}
function planBtn(type,id,amount,why){if(inPlan(type,id))return `<button class="btn sm ok" onclick="go('plan')">✓ في الخطة</button>`;
  return `<button class="btn sm" onclick="addToPlan(this,'${type}',${JSON.stringify(String(id)).replace(/"/g,'&quot;')},${Math.round(amount||0)},'${esc(why||'')}')">+ للخطة</button>`}
async function addToPlan(btn,type,clientId,amount,why){await busy(btn,'',async()=>{await api('/api/plan/items',{method:'POST',body:JSON.stringify({type,clientId,amount,why})});
  toast('اتضاف لخطة الشهر');await loadData();btn.outerHTML=planBtn(type,clientId)})}

/* ===== الصفحات ===== */
const PAGES=[['dash','الرئيسية'],['sales','المبيعات'],['rec','المديونيات'],['goals','الأهداف'],['plan','خطة الشهر'],['ai','المساعد الذكي'],['settings','الإعدادات']];
function badge(p){if(p==='rec'){const n=D.debtors.filter(d=>d.maxLate>30).length;return n?`<span class="bd">${n}</span>`:''}
  if(p==='plan'){const t=D.plan.totals,n=t.count-t.done;return n?`<span class="bd" style="background:var(--ai)">${n}</span>`:''}
  if(p==='goals'&&!D.month.target)return '<span class="bd" style="background:var(--y)">!</span>';return ''}
function go(p,extra){S.page=p;Object.assign(S,extra||{});closeM();render();window.scrollTo(0,0)}
const head=(t,btns)=>`<div class="top"><h2>${t}</h2><div class="row noprint">${btns||''}</div></div>`;
function statusBanner(){if(!D.daftraConfigured)return `<div class="banner warn">دفترة غير مربوطة. <a href="#" onclick="go('settings');return false">افتح الإعدادات</a> وأضف الساب دومين والمفتاح.</div>`;
  if(D.lastError)return `<div class="banner warn">آخر مزامنة فشلت: ${esc(D.lastError)}</div>`;
  return `<div class="banner ok">مربوط بدفترة · آخر تحديث: ${D.lastSync?new Date(D.lastSync).toLocaleString('ar-EG'):'—'}</div>`}
const syncBtn=()=>`<button class="btn" onclick="doSync(this)">↻ تحديث من دفترة</button>`;

/* رسوم */
function ring(p,size=124){const r=52,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p||0)),col=p==null?'#c9c2b6':p>=1?'#1f7a4a':p>=.9?'#b7860b':'#0f5c5c';
  return `<svg width="${size}" height="${size}" viewBox="0 0 124 124"><circle cx="62" cy="62" r="${r}" fill="none" stroke="#eee9e0" stroke-width="12"/><circle cx="62" cy="62" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 62 62)"/><text x="62" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2a2e">${p==null?'—':Math.round(p*100)+'%'}</text><text x="62" y="80" text-anchor="middle" font-size="11" fill="#6b7a7f">من الهدف</text></svg>`}
function trendChart(rows){const W=900,H=230,p=26,max=Math.max(1,...rows.map(r=>Math.max(r.sales,r.target)))*1.1,y=v=>H-p-(v/max)*(H-p-10),gw=(W-10)/rows.length,bw=Math.min(28,gw*.6);
  let s='';rows.forEach((r,i)=>{const x=5+i*gw+gw/2,col=!r.target?'#0f5c5c':r.sales>=r.target?'#1f7a4a':'#d9a441';
    s+=`<g style="cursor:pointer" onclick="go('sales')"><rect x="${x-bw/2}" y="${y(r.sales)}" width="${bw}" height="${Math.max(0,H-p-y(r.sales))}" rx="4" fill="${col}"><title>${ml(r.month)}: ${f(r.sales)}${r.target?' / هدف '+f(r.target):''}</title></rect>${r.target?`<line x1="${x-bw/2-3}" x2="${x+bw/2+3}" y1="${y(r.target)}" y2="${y(r.target)}" stroke="#1d2a2e" stroke-width="2"/>`:''}<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7a7f">${MN[+r.month.slice(5)-1].slice(0,4)}</text></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:260px">${s}</svg><div class="row note"><span style="color:#1f7a4a">■ حقق الهدف</span><span style="color:#d9a441">■ أقل من الهدف</span><span>━ الهدف</span></div>`}
function dailyChart(){const M=D.month,W=900,H=230,p=24,dd=D.daily;let cum=0;const pts=[];dd.forEach(d=>{if(!d.future){cum+=d.sales;pts.push([d.day,cum])}});
  const max=Math.max(1,M.target,M.projection,cum)*1.08,x=d=>8+(d-1)/(M.daysInMonth-1)*(W-16),y=v=>H-p-(v/max)*(H-p-10);
  const line=pts.map(q=>x(q[0])+','+y(q[1])).join(' ');const last=pts[pts.length-1]||[1,0];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:260px">${M.target?`<line x1="${x(1)}" y1="${y(0)}" x2="${x(M.daysInMonth)}" y2="${y(M.target)}" stroke="#1d2a2e" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${x(M.daysInMonth)}" y="${y(M.target)-6}" font-size="11" fill="#1d2a2e">الهدف</text>`:''}
  <line x1="${x(last[0])}" y1="${y(last[1])}" x2="${x(M.daysInMonth)}" y2="${y(M.projection)}" stroke="#5b3fa6" stroke-dasharray="3 4" stroke-width="2"/>
  <polyline points="${line}" fill="none" stroke="#0f5c5c" stroke-width="3"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="#0f5c5c"/>
  ${[1,10,20,M.daysInMonth].map(d=>`<text x="${x(d)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#6b7a7f">${d}</text>`).join('')}</svg>
  <div class="row note"><span style="color:#0f5c5c">━ المبيعات التراكمية</span><span style="color:#5b3fa6">┅ المتوقع لآخر الشهر</span>${M.target?'<span>┅ مسار الهدف</span>':''}</div>`}

/* ---------- الرئيسية ---------- */
function nextActions(){const out=[];const M=D.month;
  if(!M.target)out.push({ico:'🎯',c:'y',t:'حدد هدف الشهر والسنة',d:'من غير هدف البرنامج مش هيقدر يحسب الفجوة ولا يبني الخطة.',b:`<button class="btn sm p" onclick="go('goals')">حدد الهدف</button>`});
  for(const d of D.debtors.filter(x=>x.overdue>0).slice(0,3))out.push({ico:'💰',c:d.maxLate>30?'r':'y',t:`حصّل ${m$(d.overdue)} من ${esc(d.name)}`,d:`متأخر ${d.maxLate} يوم · إجمالي عليه ${m$(d.total)}`,b:contactBtns(d.id,'collect')+planBtn('collect',d.id,d.total,'متأخر '+d.maxLate+' يوم')+`<button class="btn sm" onclick="stmt('${esc(d.id)}')">كشف</button>`});
  for(const c of D.clients.dormant.slice(0,2))out.push({ico:'😴',c:'b',t:`رجّع ${esc(c.name)}`,d:`آخر شراء من ${c.idle} يوم · اشترى ${m$(c.t12)} آخر سنة · متوسط فاتورته ${m$(c.avg)}`,b:contactBtns(c.id,'sell')+planBtn('sell',c.id,c.avg,'عميل نايم')});
  if(M.target&&M.need>0&&!D.plan.items.length)out.splice(M.target?0:1,0,{ico:'🧭',c:'pu',t:`فاضل ${m$(M.need)} على هدف الشهر`,d:`${m$(M.perDay)} يوميًا لمدة ${M.daysLeft} يوم. خلّي البرنامج يبنيلك خطة تقفل الفجوة.`,b:`<button class="btn sm ai" onclick="suggestPlan(this)">✨ اعمل خطة</button>`});
  return out.slice(0,6)}
function pDash(){const M=D.month,Y=D.year,R=D.rec,PL=D.plan.totals;
  const vsLM=M.lastMonthSameDay?(M.sales-M.lastMonthSameDay)/M.lastMonthSameDay:null;
  const stat=M.target?(M.projectedPct>=1?['g','ماشي فوق الهدف']:M.projectedPct>=.9?['y','قريب من الهدف']:['r','أقل من الهدف']):['b','بدون هدف'];
  const acts=nextActions();
  return head(`الرئيسية — ${ml(M.month)}`,syncBtn()+`<button class="btn ai" onclick="go('ai');runInsights()">✨ تحليل شامل</button>`)+statusBanner()+

/* ---------- AI ---------- */
const PG={sales:'المبيعات',rec:'المديونيات',goals:'الأهداف',plan:'الخطة'};
const insHtml=a=>(a||[]).map(i=>`<div class="ins ${i.type==='idea'?'':esc(i.type)}"><div><b>${esc(i.title)}</b>${esc(i.body)}</div>${PG[i.action]?`<button class="btn sm noprint" onclick="go('${i.action}')">${PG[i.action]} ←</button>`:''}</div>`).join('')||'<p class="note">مفيش ملاحظات.</p>';
function insBox(){if(S.insBusy)return '<p><span class="spin"></span> بيحلل المبيعات والمديونيات والأهداف والخطة مع بعض...</p>';
  if(!S.insights)return '<p class="note">اضغط "حلّل" والمساعد يقرأ الأربعة مع بعض ويقولك تعمل إيه.</p>';
  const r=S.insights;return (r.summary?`<p style="margin-top:0">${esc(r.summary)}</p>`:'')+insHtml(r.insights)+(r.note?`<p class="note">${esc(r.note)}</p>`:'')}
async function runInsights(btn,scope){S.insBusy=true;const b=$('insbox');if(b)b.innerHTML=insBox();if(btn)btn.disabled=true;
  try{S.insights=await api('/api/ai',{method:'POST',body:JSON.stringify({scope:scope||'all'})})}catch(e){S.insights={insights:[],note:e.message}}
  S.insBusy=false;const b2=$('insbox');if(b2)b2.innerHTML=insBox();if(btn)btn.disabled=false}
async function aiModal(scope,title){modal(`<div class="top"><h3>✨ ${title}</h3><button class="btn noprint" onclick="closeM()">إغلاق</button></div><div id="aim"><p><span class="spin"></span> جاري التحليل...</p></div>`);
  try{const r=await api('/api/ai',{method:'POST',body:JSON.stringify({scope})});const el=$('aim');if(el)el.innerHTML=(r.summary?`<p>${esc(r.summary)}</p>`:'')+insHtml(r.insights)+(r.note?`<p class="note">${esc(r.note)}</p>`:'')}
  catch(e){const el=$('aim');if(el)el.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function pAI(){const qs=['إزاي أحقق هدف الشهر؟','مين أبدأ أحصّل منه؟','مين العملاء اللي ممكن أبيع لهم أكتر؟','هل هدفي السنوي واقعي؟','إيه أكبر خطر عليا الشهر ده؟'];
  return head('المساعد الذكي',`<button class="btn ai" onclick="runInsights(this);setTimeout(render,50)">✨ تحليل شامل</button>`)+`<div class="two"><div class="card"><h3>اسأل</h3><div class="chat" id="chat">${S.chat.map(c=>`<div class="q">${esc(c.q)}</div>${c.a}`).join('')||'<p class="note">المساعد شايف مبيعاتك من دفترة، مديونيات العملاء، أهدافك، وخطة الشهر — اسأله أي حاجة.</p>'}</div>
  <div class="row" style="margin-bottom:10px">${qs.map(q=>`<button class="chip" onclick="ask(this.textContent)">${q}</button>`).join('')}</div>
  <div class="row"><input id="q" style="flex:1;width:auto" placeholder="اكتب سؤالك..." onkeydown="if(event.key==='Enter')ask()"><button class="btn ai" id="askb" onclick="ask()">اسأل</button></div>
  ${D.aiConfigured?'':'<p class="note">الذكاء الاصطناعي غير مفعّل — بيشتغل بقواعد ثابتة. <a href="#" onclick="go(\'settings\');return false">أضف مفتاح Anthropic</a> للتحليل الكامل.</p>'}</div>
  <div class="card"><h3>التحليل الشامل</h3><div id="insbox">${insBox()}</div></div></div>`}
async function ask(q){q=q||$('q').value.trim();if(!q||S.busy)return;S.busy=true;S.chat.push({q,a:'<p><span class="spin"></span></p>'});render();
  try{const r=await api('/api/ai',{method:'POST',body:JSON.stringify({question:q})});S.chat[S.chat.length-1].a=(r.summary?`<p>${esc(r.summary)}</p>`:'')+insHtml(r.insights)}
  catch(e){S.chat[S.chat.length-1].a=`<p class="err">${esc(e.message)}</p>`}S.busy=false;render();const c=$('chat');if(c)c.scrollTop=c.scrollHeight}

  let body='';

  `<div class="grid"><div class="card"><div class="l note">الشهر لحد النهارده</div><div class="kpi"><div class="v">${m$(M.sales)}</div></div><div class="note">${M.invoices} فاتورة · متوسط ${m$(M.invoices?M.sales/M.invoices:0)}</div></div>
   <div class="card"><div class="note">المتوقع لآخر الشهر</div><div class="kpi"><div class="v">${m$(M.projection)}</div></div><div class="note">${M.target?`<span class="tag ${pcls(M.projectedPct)}">${P(M.projectedPct)} من الهدف</span>`:'بدون هدف'}</div></div>
   <div class="card"><div class="note">الشهر اللي فات</div><div class="kpi"><div class="v">${m$(M.lastMonth)}</div></div><div class="note">نفس الشهر السنة اللي فاتت: ${m$(M.lastYear)}</div></div>
   <div class="card"><div class="note">العملاء النشطين (آخر سنة)</div><div class="kpi"><div class="v">${C.active}</div></div><div class="note">أكبر 5 = <b class="${C.top5Share>.6?'dn':''}">${P(C.top5Share)}</b> من المبيعات</div></div></div>

  <div class="card"><div class="row" style="margin-bottom:10px">${tabs.map(t=>`<button class="chip ${S.salesTab===t[0]?'on':''}" onclick="S.salesTab='${t[0]}';render()">${t[1]}${t[0]==='gap'?' ('+C.notThisMonth.length+')':t[0]==='dormant'?' ('+C.dormant.length+')':''}</button>`).join('')}</div>${body}</div>`}

  const chips=[['all','الكل',R.all],['r',STL.r,R.r],['y',STL.y,R.y],['g',STL.g,R.g]];

  return head('مديونيات العملاء',syncBtn()+`<button class="btn ai" onclick="aiModal('rec','خطة التحصيل')">✨ خطة تحصيل</button><button class="btn p" onclick="recReport()">تقرير PDF</button>`)+
  `<div class="grid">${chips.map(c=>`<div class="card kpi" onclick="S.recF='${c[0]}';render()" style="${F===c[0]?'border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)':''}"><div class="l">${c[0]==='all'?'':`<span class="tag ${c[0]}">●</span> `}${c[1]}</div><div class="v ${c[0]==='r'?'dn':c[0]==='y'?'wn':c[0]==='g'?'up':''}">${m$(c[2])}</div><div class="d">${c[0]==='all'?(R.dso!=null?`متوسط التحصيل ${R.dso} يوم · مستحق الشهر ده ${k$(R.dueThisMonth)}`:R.count+' فاتورة'):D.receivables.filter(d=>st(d)===c[0]).length+' فاتورة'}</div></div>`).join('')}</div>
  ${R.overdue?`<div class="banner info">تحصيل المتأخر (${m$(R.overdue)}) = ${D.month.target?P(R.overdue/D.month.target)+' من هدف مبيعات الشهر':'سيولة جاهزة'} من غير بيع جديد. ${D.debtors.filter(d=>d.overdue>0&&!inPlan('collect',d.id)).length?`<a href="#" onclick="planAllOverdue(this);return false">ضيف كل المتأخرين للخطة</a>`:''}</div>`:''}

   ${deb.map(d=>`<tr class="s${d.maxLate>30?'r':d.overdue?'y':'g'}"><td><a href="#" onclick="stmt('${esc(d.id)}');return false"><b>${esc(d.name)}</b></a></td><td class="n"><b>${f(d.total)}</b></td><td class="n">${d.overdue?`<span class="dn">${f(d.overdue)}</span>`:'—'}</td><td>${d.maxLate?`<span class="tag ${d.maxLate>30?'r':'y'}">${d.maxLate} يوم</span>`:'<span class="tag g">في موعده</span>'}</td><td class="n">${d.invoices}</td>
   <td><div class="row">${contactBtns(d.id,'collect')}${planBtn('collect',d.id,d.total,d.maxLate?'متأخر '+d.maxLate+' يوم':'')}<button class="btn sm" onclick="stmt('${esc(d.id)}')">كشف حساب</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="note">مفيش مديونيات هنا 👌</td></tr>'}</table></div>`
  :`<div class="tw"><table><tr><th>العميل</th><th>الفاتورة</th><th>التاريخ</th><th>الاستحقاق</th><th>الحالة</th><th class="n">المتبقي</th></tr>
   ${inv.map(d=>`<tr class="click" onclick="stmt('${esc(d.who)}')"><td>${esc(d.name)}</td><td>${esc(d.inv)}</td><td>${esc(d.date||'')}</td><td>${esc(d.due)}</td><td><span class="tag ${st(d)}">${days(d.due)>0?days(d.due)+' يوم تأخير':'في موعده'}</span></td><td class="n"><b>${f(d.amount)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="note">مفيش فواتير هنا.</td></tr>'}</table></div>`}</div>`}
async function planAllOverdue(a){const list=D.debtors.filter(d=>d.overdue>0&&!inPlan('collect',d.id));a.textContent='جاري الإضافة...';

   ${G.annual?`<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>اتحقق ${m$(done)} من ${m$(G.annual)}</span><b>${P(done/G.annual)}</b></div><div class="bar grn" style="margin-top:4px"><i style="width:${Math.min(100,done/G.annual*100)}%"></i></div>
   ${y===D.year.year?`<p class="note">المتوقع لآخر السنة: <b class="${pcls(D.year.projectedPct)==='g'?'up':'dn'}">${m$(D.year.projection)} (${P(D.year.projectedPct)})</b>${D.year.needPerMonth?` · محتاج ${m$(D.year.needPerMonth)} شهريًا في الشهور الباقية`:''}</p>`:''}</div>`:''}</div>
  <div class="card"><div class="top" style="margin-bottom:8px"><h3 style="margin:0">أهداف الشهور</h3><div class="row"><span class="note">الفاضي = تلقائي حسب موسمية السنة اللي فاتت</span><button class="btn sm" onclick="resetMonthly(this)">رجّع الكل تلقائي</button><button class="btn sm p" onclick="saveMonthly(this)">حفظ الشهور</button></div></div>
   <div class="mgrid">${G.months.map(m=>{const p=m.target?m.sales/m.target:null,past=m.month<cur;return `<div class="mcell ${m.month===cur?'cur':''}"><div class="row" style="justify-content:space-between"><b>${MN[+m.month.slice(5)-1]}</b>${m.manual?'<span class="tag b">يدوي</span>':'<span class="tag pu">تلقائي</span>'}</div>
    <input data-m="${m.month}" type="number" min="0" placeholder="${f(m.target)}" value="${m.manual?m.target:''}" style="margin:6px 0">
    <div class="note">${m.month<=cur?`اتحقق ${k$(m.sales)} ${p!=null?`<span class="tag ${pcls(p)}">${P(p)}</span>`:''}`:'—'}</div><div class="note">السنة اللي فاتت ${k$(m.lastYear)}</div>${past||m.month===cur?`<div class="bar ${p>=1?'grn':'gld'}" style="margin-top:4px"><i style="width:${Math.min(100,(p||0)*100)}%"></i></div>`:''}</div>`}).join('')}</div>
   <p class="note">مجموع أهداف الشهور: ${m$(tot)}${G.annual&&Math.abs(tot-G.annual)>1?` <span class="dn">(مختلف عن السنوي بـ ${m$(tot-G.annual)})</span>`:''}</p></div>`}
async function saveAnnual(btn){await busy(btn,'جاري الحفظ',async()=>{G=await api('/api/goals/'+S.goalYear,{method:'POST',body:JSON.stringify({annual:$('g_an').value||0})});await loadData();toast('الهدف اتحفظ واتوزع على الشهور');render()})}
async function saveMonthly(btn){const monthly={};document.querySelectorAll('.mcell input[data-m]').forEach(i=>monthly[i.dataset.m]=i.value||0);
  await busy(btn,'',async()=>{G=await api('/api/goals/'+S.goalYear,{method:'POST',body:JSON.stringify({monthly})});await loadData();toast('أهداف الشهور اتحفظت');render()})}
async function resetMonthly(btn){if(!confirm('ترجع كل الشهور لتوزيع تلقائي من الهدف السنوي؟'))return;await busy(btn,'',async()=>{G=await api('/api/goals/'+S.goalYear,{method:'POST',body:JSON.stringify({resetMonthly:true})});await loadData();render()})}

/* ---------- خطة الشهر ---------- */
const TY={collect:['💰','تحصيل','r'],sell:['📈','بيع','g'],task:['📝','مهمة','b']};
function pPlan(){const PL=D.plan,T=PL.totals,M=D.month;
  const cover=M.target?Math.min(1,(M.sales+Math.max(0,T.sellPlanned-T.sold))/M.target):null;
  const groups=['collect','sell','task'].map(t=>[t,PL.items.filter(i=>i.type===t)]).filter(g=>g[1].length);
  return head(`خطة ${ml(M.month)}`,`<button class="btn ai" onclick="suggestPlan(this)">✨ ${PL.items.length?'اقترح بنود زيادة':'اعمل خطة ذكية'}</button><button class="btn" onclick="addItemModal()">+ بند</button>`)+
  `<div class="grid">
   <div class="card"><div class="note">البنود</div><div class="kpi"><div class="v">${T.done} / ${T.count}</div></div><div class="bar grn"><i style="width:${T.count?T.done/T.count*100:0}%"></i></div></div>
   <div class="card"><div class="note">التحصيل (يتحدث من دفترة)</div><div class="kpi"><div class="v">${m$(T.collected)}</div></div><div class="note">من ${m$(T.collectPlanned)} مخطط</div><div class="bar"><i style="width:${T.collectPlanned?Math.min(100,T.collected/T.collectPlanned*100):0}%"></i></div></div>
   <div class="card"><div class="note">البيع لعملاء الخطة</div><div class="kpi"><div class="v">${m$(T.sold)}</div></div><div class="note">من ${m$(T.sellPlanned)} مخطط</div><div class="bar gld"><i style="width:${T.sellPlanned?Math.min(100,T.sold/T.sellPlanned*100):0}%"></i></div></div>
   <div class="card"><div class="note">الخطة بتغطي من الهدف</div><div class="kpi"><div class="v ${cover==null?'':cover>=1?'up':cover>=.9?'wn':'dn'}">${P(cover)}</div></div><div class="note">${M.target?(cover>=1?'لو اتنفذت الهدف هيتحقق':`ناقص ${m$(M.target-M.sales-Math.max(0,T.sellPlanned-T.sold))} — ضيف بنود بيع`):'<a href="#" onclick="go(\'goals\');return false">حدد الهدف</a>'}</div></div></div>
  ${PL.strategy?`<div class="strategy"><b>${PL.strategySource==='ai'?'✨ استراتيجية الشهر (AI)':'🧭 استراتيجية الشهر'}</b>\n${esc(PL.strategy)}</div>`:''}
  ${groups.length?groups.map(([t,items])=>`<div class="card" style="margin-bottom:12px"><h3>${TY[t][0]} ${TY[t][1]} (${items.filter(i=>i.complete).length}/${items.length})</h3>${items.map(planItem).join('')}</div>`).join('')
   :`<div class="card" style="text-align:center;padding:30px"><p style="font-size:16px;margin-top:0">لسه مفيش خطة للشهر ده</p><p class="note">البرنامج يقدر يبنيلك خطة من بياناتك: يحصّل المتأخر، يرجّع العملاء النايمين، ويكبّر الكبار — لحد ما تقفل فجوة الهدف.</p><button class="btn ai" onclick="suggestPlan(this)">✨ اعمل خطة ذكية</button></div>`}`}
function planItem(i){const pr=i.type==='collect'?(i.amount?i.achieved/i.amount:0):i.type==='sell'?(i.amount?i.achieved/i.amount:0):null;
  return `<div class="plan-it ${i.complete?'done':''}"><button class="chk ${i.complete?'on':''}" title="${i.auto?'اتعلّم تلقائيًا من دفترة':'علّم كخلص'}" onclick="toggleItem(this,${i.id},${!i.done})" ${i.auto?'disabled':''}>${i.complete?'✓':''}</button>
  <div style="min-width:0"><div class="tt"><b>${esc(i.text)}</b>${i.amount?` — ${m$(i.amount)}`:''} ${i.auto?'<span class="tag g">اتحقق من دفترة</span>':''}</div>
   ${i.why?`<div class="note">${esc(i.why)}</div>`:''}${i.how?`<div class="note" style="color:var(--ai)">✨ ${esc(i.how)}</div>`:''}
   ${pr!=null&&i.clientId!=null?`<div class="row" style="margin-top:4px"><div class="bar ${i.type==='sell'?'gld':''}" style="flex:1;min-width:100px;max-width:260px"><i style="width:${Math.min(100,pr*100)}%"></i></div><span class="note">${i.type==='collect'?'اتحصّل':'اتباع'} ${f(i.achieved)}${i.type==='collect'?' · باقي عليه '+f(i.now):''}</span></div>`:''}</div>
  <div class="row acts">${i.clientId!=null?contactBtns(i.clientId,i.type==='collect'?'collect':'sell'):''}${i.type==='collect'&&i.clientId!=null?`<button class="btn sm" onclick="stmt('${esc(i.clientId)}')">كشف</button>`:''}<button class="btn sm ghost" title="حذف" onclick="delItem(this,${i.id})">✕</button></div></div>`}
async function toggleItem(btn,id,done){await busy(btn,'',async()=>{await api('/api/plan/items/'+id,{method:'PATCH',body:JSON.stringify({done})});if(done)toast('عاش! 👏');await refresh()})}
async function delItem(btn,id){if(!confirm('حذف البند؟'))return;await busy(btn,'',async()=>{await api('/api/plan/items/'+id,{method:'DELETE'});await refresh()})}
let SUG=null;
async function suggestPlan(btn){await busy(btn,D.aiConfigured?'الـ AI بيبني الخطة':'بيبني الخطة',async()=>{SUG=await api('/api/plan/suggest',{method:'POST',body:'{}'});
  if(!SUG.items.length){toast('كل الفرص المقترحة موجودة في خطتك بالفعل 👌');render();return}
  modal(`<div class="top"><h3>✨ خطة مقترحة ${SUG.source==='ai'?'(AI)':''}</h3><button class="btn" onclick="closeM()">إلغاء</button></div>
   <div class="strategy">${esc(SUG.strategy)}</div><p class="note">اختار البنود اللي عايزها — التقدّم بيتحدث تلقائيًا من دفترة.</p>
   ${SUG.items.map((it,k)=>`<label class="act" style="cursor:pointer;color:inherit;font-size:14px"><input type="checkbox" checked data-k="${k}" style="width:20px;height:20px" onchange="sugTotal()"><span class="ico ${TY[it.type][2]}">${TY[it.type][0]}</span><div class="t"><b>${esc(it.text)} — ${m$(it.amount)}</b><span class="note">${esc(it.why||'')}</span>${it.how?`<span class="note" style="display:block;color:var(--ai)">✨ ${esc(it.how)}</span>`:''}</div></label>`).join('')}
   <div class="row" style="margin-top:12px;justify-content:space-between"><span id="sugt" class="note"></span><button class="btn p" id="sugb" onclick="applySug(this)">ضيف للخطة</button></div>`);sugTotal()})}
function sugTotal(){const ch=[...document.querySelectorAll('[data-k]')].filter(x=>x.checked).map(x=>SUG.items[+x.dataset.k]);const c=ch.filter(i=>i.type==='collect').reduce((s,i)=>s+i.amount,0),s=ch.filter(i=>i.type==='sell').reduce((a,i)=>a+i.amount,0);
  const el=$('sugt');if(el)el.innerHTML=`${ch.length} بند · تحصيل ${m$(c)} · بيع ${m$(s)}${D.month.target?` · يغطي <b>${P(Math.min(1,(D.month.sales+s)/D.month.target))}</b> من الهدف`:''}`}
async function applySug(btn){const ch=[...document.querySelectorAll('[data-k]')].filter(x=>x.checked).map(x=>SUG.items[+x.dataset.k]);if(!ch.length){toast('اختار بند واحد على الأقل');return}
  await busy(btn,'جاري الإضافة',async()=>{await api('/api/plan/apply',{method:'POST',body:JSON.stringify({strategy:SUG.strategy,source:SUG.source,items:ch})});closeM();toast('الخطة جاهزة — '+ch.length+' بند');S.page='plan';await refresh()})}
function addItemModal(){modal(`<div class="top"><h3>بند جديد في الخطة</h3><button class="btn" onclick="closeM()">إغلاق</button></div>
  <div class="form"><div><label>النوع</label><select id="ni_t" onchange="niHint()"><option value="collect">💰 تحصيل من عميل</option><option value="sell">📈 بيع لعميل</option><option value="task">📝 مهمة</option></select></div>
  <div><label>العميل</label><input id="ni_c" list="ni_cl" placeholder="اكتب اسم العميل..." oninput="niHint()"><datalist id="ni_cl">${D.clientsList.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div>
  <div><label>المبلغ</label><input id="ni_a" type="number" min="0"></div><div style="grid-column:1/-1"><label>وصف (اختياري للعميل)</label><input id="ni_x" placeholder="مثال: زيارة وعرض المنتج الجديد"></div></div>
  <div id="ni_h" class="note" style="margin-top:6px"></div><div class="err" id="ni_e"></div><div class="row" style="margin-top:10px"><button class="btn p" onclick="saveItem(this)">إضافة</button></div>`)}
function niC(){const v=$('ni_c').value.trim();return D.clientsList.find(c=>c.name===v)}
function niHint(){const c=niC(),t=$('ni_t').value,h=$('ni_h');if(!c){h.textContent='';return}
  const owed=owedBy(c.id).reduce((s,d)=>s+d.amount,0),s=[...D.clients.top,...D.clients.dormant,...D.clients.notThisMonth].find(x=>String(x.id)===String(c.id));
  if(t==='collect'){h.innerHTML=owed?`عليه ${m$(owed)}`:'<span class="dn">العميل ده مفيش عليه مديونية.</span>';if(owed&&!$('ni_a').value)$('ni_a').value=Math.round(owed)}
  else if(t==='sell'&&s){h.innerHTML=`متوسط فاتورته ${m$(s.avg)} · آخر شراء من ${s.idle} يوم`;if(!$('ni_a').value)$('ni_a').value=s.avg}else h.textContent=''}
async function saveItem(btn){const t=$('ni_t').value,c=niC(),txt=$('ni_x').value.trim();if(t!=='task'&&!c){$('ni_e').textContent='اختار العميل من القائمة';return}
  await busy(btn,'',async()=>{await api('/api/plan/items',{method:'POST',body:JSON.stringify({type:t,clientId:c?c.id:'',amount:$('ni_a').value,text:txt})});closeM();toast('البند اتضاف');await refresh()})}

/* ---------- الإعدادات ---------- */
let SET=null;
function pSettings(){setTimeout(loadSettings,0);return head('الإعدادات')+`<div id="setwrap"><p class="note"><span class="spin"></span> تحميل...</p></div>`}
async function loadSettings(){try{SET=await api('/api/settings');renderSettings()}catch(e){const w=$('setwrap');if(w)w.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function renderSettings(){const w=$('setwrap');if(!w)return;const s=SET;
  w.innerHTML=`<div class="card" style="max-width:620px">
    <h3>ربط دفترة (Daftra)</h3><p class="note">المفتاح من دفترة: الإعدادات ← مفاتيح الـ API. البرنامج يقرأ المبيعات والعملاء فقط ولا يعدّل في دفترة.</p>
    <div class="form" style="grid-template-columns:1fr">
      <div><label>الساب دومين</label><input id="s_sub" value="${esc(s.daftraSubdomain)}" placeholder="مثال: eliteskin"><div class="note">لو حسابك https://eliteskin.daftara.com اكتب eliteskin فقط.</div></div>
      <div><label>النطاق</label><select id="s_dom"><option value="daftara.com"${s.daftraDomain==='daftara.com'?' selected':''}>daftara.com</option><option value="daftra.com"${s.daftraDomain==='daftra.com'?' selected':''}>daftra.com</option></select></div>
      <div><label>مفتاح الـ API ${s.daftraApikeySet?'<span class="tag g">محفوظ</span>':s.envDaftra?'<span class="tag b">من إعدادات السيرفر</span>':'<span class="tag r">غير محفوظ</span>'}</label><input id="s_key" type="password" placeholder="${s.daftraApikeySet?'••••••• (اكتب مفتاحًا جديدًا للتغيير)':'الصق المفتاح هنا'}"></div>
      <div><label>مزامنة تلقائية كل (دقيقة)</label><input id="s_sync" type="number" min="5" value="${s.syncEveryMinutes}"></div>
      <div><label>العملة</label><input id="s_cur" value="${esc(s.currency)}" placeholder="ر.س"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn p" onclick="saveSettings(this)">حفظ ومزامنة</button><button class="btn" onclick="testDaftra(this)">اختبار الاتصال</button>${s.daftraApikeySet?'<button class="btn sm" onclick="clearKey(\'daftra\')">حذف المفتاح</button>':''}</div>
    <div id="s_msg" style="margin-top:8px"></div></div>
  <div class="card" style="max-width:620px;margin-top:12px"><h3>الذكاء الاصطناعي</h3><p class="note">مفتاح Anthropic (من console.anthropic.com) لتفعيل التحليل والخطة الذكية الكاملة. بدونه يشتغل بقواعد ثابتة.</p>
    <div><label>مفتاح Anthropic ${s.anthropicKeySet||s.envAnthropic?'<span class="tag g">مفعّل</span>':'<span class="tag y">غير مفعّل</span>'}</label><input id="s_ai" type="password" placeholder="${s.anthropicKeySet?'••••••• (اكتب مفتاحًا جديدًا للتغيير)':'sk-ant-...'}"></div>
    <div class="row" style="margin-top:10px"><button class="btn p" onclick="saveAI(this)">حفظ مفتاح الـ AI</button>${s.anthropicKeySet?'<button class="btn sm" onclick="clearKey(\'ai\')">حذف المفتاح</button>':''}</div><div id="s_aimsg" style="margin-top:8px"></div></div>`}
async function saveSettings(btn){const msg=$('s_msg');await busy(btn,'جاري الحفظ والمزامنة',async()=>{const body={daftraSubdomain:$('s_sub').value,daftraDomain:$('s_dom').value,syncEveryMinutes:$('s_sync').value,currency:$('s_cur').value};const k=$('s_key').value.trim();if(k)body.daftraApikey=k;
  const r=await api('/api/settings',{method:'POST',body:JSON.stringify(body)});await loadData();
  msg.innerHTML=r.sync&&!r.sync.ok?`<span class="banner warn" style="display:inline-block">حُفظ، لكن تعذّرت المزامنة: ${esc(r.sync.error)}</span>`:r.sync&&r.sync.ok?`<span class="banner ok" style="display:inline-block">تم: ${r.sync.counts.clients} عميل، ${r.sync.counts.invoices} فاتورة بيع، ${r.sync.counts.open} فاتورة مفتوحة.</span>`:'<span class="banner info" style="display:inline-block">تم الحفظ.</span>';await loadSettings()})}
async function testDaftra(btn){const msg=$('s_msg');await busy(btn,'جاري الاختبار',async()=>{const k=$('s_key').value.trim();if(k||$('s_sub').value!==SET.daftraSubdomain){const body={daftraSubdomain:$('s_sub').value,daftraDomain:$('s_dom').value};if(k)body.daftraApikey=k;await api('/api/settings',{method:'POST',body:JSON.stringify(body)})}
  const r=await api('/api/daftra/test',{method:'POST'});msg.innerHTML=r.ok?`<span class="banner ok" style="display:inline-block">${esc(r.message)}</span>`:`<span class="banner warn" style="display:inline-block">${esc(r.error)}</span>`})}
async function saveAI(btn){const msg=$('s_aimsg'),k=$('s_ai').value.trim();if(!k){msg.innerHTML='<span class="err">اكتب المفتاح أولًا.</span>';return}
  await busy(btn,'جاري الحفظ',async()=>{await api('/api/settings',{method:'POST',body:JSON.stringify({anthropicKey:k})});await loadData();msg.innerHTML='<span class="banner ok" style="display:inline-block">تم تفعيل الذكاء الاصطناعي.</span>';await loadSettings()})}
async function clearKey(which){if(!confirm('حذف المفتاح؟'))return;await api('/api/settings',{method:'POST',body:JSON.stringify(which==='daftra'?{clearDaftraKey:true}:{clearAnthropicKey:true})});await loadData();await loadSettings()}

async function doSync(btn){await busy(btn,'جاري التحديث',async()=>{const r=await api('/api/sync',{method:'POST'});await loadData();render();toast(r.ok?'اتحدث من دفترة ✓':'تعذّرت المزامنة: '+r.error)})}

function modal(h){$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="mod">${h}</div></div>`}
function closeM(){$('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

function render(){const R={dash:pDash,sales:pSales,rec:pRec,goals:pGoals,plan:pPlan,ai:pAI,settings:pSettings};
  $('root').innerHTML=`<div class="app"><aside class="side"><h1>المتابعة المالية</h1><small>Elite Skin</small><div id="nav">${PAGES.map(p=>`<button class="nav ${S.page===p[0]?'on':''}" onclick="go('${p[0]}')"><span>${p[1]}</span>${badge(p[0])}</button>`).join('')}</div><div class="foot"><button class="nav" onclick="logout()">خروج</button></div></aside><main class="main"><div class="page" id="page">${R[S.page]()}</div></main></div>`}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function loginScreen(err){$('root').innerHTML=`<div class="login"><h1>المتابعة المالية</h1><p>Elite Skin — تسجيل الدخول</p>
  <label>كلمة المرور</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="le">${esc(err||'')}</div><p><button class="btn p" style="width:100%;justify-content:center" id="lb" onclick="doLogin()">دخول</button></p></div>`;const el=$('pw');if(el)el.focus()}
async function doLogin(){$('lb').disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
  if(r.ok){await boot()}else{const j=await r.json().catch(()=>({}));loginScreen(j.error||'فشل الدخول')}}catch(e){loginScreen(e.message)}}
async function boot(){try{const me=await (await fetch('/api/me')).json();if(!me.authed){loginScreen();return}await loadData();render()}catch(e){loginScreen(e.message)}}
boot();
</script>
</body>
</html>
