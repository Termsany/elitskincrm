<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتابعة المالية — Elite Skin</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d2a2e;--mut:#6b7a7f;--line:#e4dfd6;--pri:#0f5c5c;--pri2:#e3f0ee;--r:#c8372d;--rb:#fbe6e3;--y:#b7860b;--yb:#fdf3d3;--g:#1f7a4a;--gb:#dff3e7;--ai:#5b3fa6;--aib:#efeafa}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button,input,select{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:200px;background:var(--pri);color:#fff;padding:16px 10px;flex-shrink:0;display:flex;flex-direction:column}
.side h1{font-size:16px;margin:0 8px 4px}
.side small{display:block;margin:0 8px 16px;opacity:.7;font-size:11px}
.nav{display:block;width:100%;text-align:right;background:none;border:0;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;opacity:.85;margin-bottom:2px}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:var(--pri);opacity:1;font-weight:600}
.side .foot{margin-top:auto;font-size:11px;opacity:.75;padding:8px}
.main{flex:1;padding:20px 24px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:21px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{padding:14px 18px;font-size:15px;font-weight:600;flex:1;min-width:230px;text-align:right}
.btn.big span{display:block;font-weight:400;font-size:12px;opacity:.85}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi{cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--pri);transform:translateY(-2px)}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:21px;font-weight:700;margin:2px 0}
.kpi .d{font-size:12px}
.up{color:var(--g)}.dn{color:var(--r)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}.app{flex-direction:column}.side{width:auto;padding:8px}.side h1,.side small,.side .foot{display:none}#nav{display:flex;gap:4px;overflow-x:auto}.nav{width:auto;white-space:nowrap;margin:0;padding:7px 11px}.main{padding:14px}}
h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#faf8f4}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600}
.r{background:var(--rb);color:var(--r)}.y{background:var(--yb);color:var(--y)}.g{background:var(--gb);color:var(--g)}
.b{background:var(--pri2);color:var(--pri)}.pu{background:var(--aib);color:var(--ai)}
tr.sr td:first-child{border-right:4px solid var(--r)}tr.sy td:first-child{border-right:4px solid var(--y)}tr.sg td:first-child{border-right:4px solid var(--g)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:8px;background:#eee9e0;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.ins{border-right:4px solid var(--ai);background:var(--aib);padding:10px 14px;border-radius:8px;margin-bottom:8px}
.ins.warn{border-color:var(--r);background:var(--rb)}.ins.good{border-color:var(--g);background:var(--gb)}
.ins b{display:block}
.note{font-size:12px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(20,30,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:9}
.mod{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:760px}
.mod .top{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.err{color:var(--r);font-size:12px;margin-top:6px}
.banner{padding:7px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.banner.warn{background:var(--rb);color:var(--r)}.banner.info{background:var(--yb);color:#6b4e00}.banner.ok{background:var(--gb);color:var(--g)}
.chat{max-height:340px;overflow:auto;margin-bottom:10px}
.q{background:var(--pri2);padding:8px 12px;border-radius:10px;margin:8px 0;width:fit-content}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ai);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font-size:20px;margin:0 0 4px}.login p{margin:0 0 18px;color:var(--mut)}
@media print{body{background:#fff}.side,.noprint,.banner{display:none!important}.main{padding:0}.ov{position:static;background:none;padding:0}.mod{max-width:none;padding:0}body.printing .page{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const TYPE={fixed:['ثابت متكرر','b'],temp:['مؤقت بمدة','pu'],once:['مرة واحدة','g']};
const STL={r:'متأخر أكثر من شهر',y:'متأخر أقل من شهر',g:'في موعده'};
let D=null, TODAY=new Date(), CM='';
const S={page:'dash',month:'',recF:'all',payF:'all',recTab:'debts',payTab:'debts',chat:[],busy:false};

const f=n=>Math.round(n||0).toLocaleString('en-US');
const m$=n=>f(n)+' '+(D?D.currency:'');
const ml=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const addM=(m,k)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const pct=(a,b)=>b?((a-b)/b*100):0;
let MONTHS=[];
function calcMonths(){MONTHS=[];for(let i=5;i>=0;i--)MONTHS.push(addM(CM,-i))}

/* مصاريف */
function active(e,m){if(e.type==='fixed')return e.start<=m&&(!e.stop||m<e.stop);if(e.type==='temp')return e.start<=m&&m<=e.end;return(e.date||'').slice(0,7)===m}
const expItems=m=>D.expenses.filter(e=>active(e,m));
const expTotal=m=>expItems(m).reduce((s,e)=>s+(+e.amount||0),0);
const catTotal=(m,c)=>expItems(m).filter(e=>e.cat===c).reduce((s,e)=>s+(+e.amount||0),0);
const sales=m=>D.sales[m]||0, purch=m=>D.purchases[m]||0;
const profit=m=>sales(m)-purch(m)-expTotal(m);
function remaining(e){const from=e.start>CM?e.start:CM;const n=Math.max(0,((e.end.slice(0,4)-from.slice(0,4))*12+(e.end.slice(5)-from.slice(5)))+1);return{n,amount:n*e.amount}}

/* مديونيات */
const late=d=>Math.floor((TODAY-new Date(d.due))/864e5);
const st=d=>{const l=late(d);return l>30?'r':l>0?'y':'g'};
const list=k=>k==='rec'?D.receivables:D.payables;
const people=k=>k==='rec'?D.clients:D.suppliers;
const who=(k,id)=>people(k).find(p=>String(p.id)===String(id))||{name:'',phone:''};
const tot=(k,s)=>list(k).filter(d=>!s||st(d)===s).reduce((x,d)=>x+d.amount,0);
const bal=(k,id)=>list(k).filter(d=>String(d.who)===String(id)).reduce((x,d)=>x+d.amount,0);

/* API */
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts));
  if(r.status===401){location.reload();return}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function loadData(){D=await api('/api/data');CM=D.today.slice(0,7);TODAY=new Date(D.today);calcMonths();if(!S.month)S.month=CM}

/* رسم بياني */
function chart(){const W=560,H=210,p=30,bw=26,vals=MONTHS.map(sales),max=Math.max(1,...vals)*1.1,y=v=>H-p-(v/max)*(H-p-12),gw=(W-p)/MONTHS.length;
  let s='',pts=[];MONTHS.forEach((m,i)=>{const x=p+i*gw+gw/2,c=purch(m)+expTotal(m);pts.push(x+','+y(profit(m)>0?profit(m):0));
    s+=`<rect x="${x-bw-2}" y="${y(sales(m))}" width="${bw}" height="${Math.max(0,H-p-y(sales(m)))}" rx="4" fill="#0f5c5c"><title>مبيعات ${ml(m)}: ${f(sales(m))}</title></rect><rect x="${x+2}" y="${y(c)}" width="${bw}" height="${Math.max(0,H-p-y(c))}" rx="4" fill="#d9a441"><title>تكاليف ${ml(m)}: ${f(c)}</title></rect><text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="#6b7a7f">${MN[+m.slice(5)-1]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${s}<polyline points="${pts.join(' ')}" fill="none" stroke="#5b3fa6" stroke-width="2.5"/>${pts.map(q=>`<circle cx="${q.split(',')[0]}" cy="${q.split(',')[1]}" r="3.5" fill="#5b3fa6"/>`).join('')}</svg><div class="row note"><span style="color:#0f5c5c">■ المبيعات</span><span style="color:#d9a441">■ المشتريات + المصاريف</span><span style="color:#5b3fa6">● صافي الربح</span></div>`}

/* AI */
const insHtml=a=>(a||[]).map(i=>`<div class="ins ${i.type==='idea'?'':i.type}"><b>${esc(i.title)}</b>${esc(i.body)}</div>`).join('')||'<p class="note">مفيش ملاحظات.</p>';
async function aiModal(scope,title){modal(`<div class="top"><h3>تحليل AI: ${title}</h3><button class="btn noprint" onclick="closeM()">إغلاق</button></div><p><span class="spin"></span> جاري التحليل...</p>`);
  try{const r=await api('/api/ai',{method:'POST',body:JSON.stringify({scope})});
    modal(`<div class="top"><h3>تحليل AI: ${title}</h3><button class="btn noprint" onclick="closeM()">إغلاق</button></div>${r.summary?`<p><b>${esc(r.summary)}</b></p>`:''}${insHtml(r.insights)}<p class="note">${r.source==='ai'?'تحليل بالذكاء الاصطناعي من بياناتك الحقيقية.':esc(r.note||'تحليل بقواعد ثابتة.')}</p>`);
  }catch(e){modal(`<div class="top"><h3>تحليل AI</h3><button class="btn" onclick="closeM()">إغلاق</button></div><p class="err">${esc(e.message)}</p>`)}}
async function ask(q){q=(q||($('q')?$('q').value:'')).trim();if(!q)return;const idx=S.chat.push({q,a:'<span class="spin"></span>'})-1;render();
  try{const r=await api('/api/ai',{method:'POST',body:JSON.stringify({question:q})});S.chat[idx].a=(r.summary?`<p><b>${esc(r.summary)}</b></p>`:'')+insHtml(r.insights)}
  catch(e){S.chat[idx].a=`<p class="err">${esc(e.message)}</p>`}render();const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}

/* صفحات */
const PAGES=[['dash','الرئيسية'],['exp','المصاريف'],['rec','العملاء'],['pay','الموردين'],['trade','البيع والشراء'],['pl','الربح والخسارة'],['ai','المساعد الذكي'],['settings','الإعدادات']];
function go(p,extra){S.page=p;Object.assign(S,extra||{});render();window.scrollTo(0,0)}
function head(t,btns){return `<div class="top"><h2>${t}</h2><div class="row noprint">${btns||''}</div></div>`}
function delta(a,b,inv){if(!b)return'';const d=pct(a,b),good=inv?d<=0:d>=0;return `<span class="${good?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}% عن الشهر السابق</span>`}
function statusBanner(){if(!D.daftraConfigured)return `<div class="banner warn">دفترة غير مربوطة. افتح <a href="#" onclick="go('settings');return false" style="color:inherit;font-weight:700">الإعدادات</a> وأضف الساب دومين ومفتاح الـ API.</div>`;
  if(D.lastError)return `<div class="banner warn">خطأ في المزامنة: ${esc(D.lastError)}</div>`;
  const t=D.lastSync?new Date(D.lastSync):null;return `<div class="banner ok">مربوط بدفترة. آخر تحديث: ${t?t.toLocaleString('ar-EG'):'—'}${D.aiConfigured?'':' · الذكاء الاصطناعي غير مفعّل (أضف ANTHROPIC_API_KEY)'}</div>`}

function pDash(){const m=CM,pm=addM(m,-1),next=[0,1,2].map(k=>addM(m,k));
  const cats=D.cats.map(c=>[c,catTotal(m,c)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=cats[0]?cats[0][1]:1;
  return head('الرئيسية — '+ml(m),`<button class="btn" onclick="doSync(this)">تحديث من دفترة</button><button class="btn ai" onclick="aiModal('all','كل العمليات')">تحليل AI شامل</button>`)+statusBanner()+
  `<div class="row" style="margin-bottom:14px"><button class="btn big p" onclick="go('rec',{recTab:'debts',recF:'all'})">تقرير مديونيات العملاء<span>المطلوب تحصيله: ${m$(tot('rec'))} | متأخر: ${m$(tot('rec','r')+tot('rec','y'))}</span></button>
  <button class="btn big" style="background:var(--ink);color:#fff" onclick="go('pay',{payTab:'debts',payF:'all'})">تقرير مستحقات الموردين<span>المطلوب سداده: ${m$(tot('pay'))} | متأخر: ${m$(tot('pay','r')+tot('pay','y'))}</span></button></div>
  <div class="grid">
   <div class="card kpi" onclick="go('trade')"><div class="l">المبيعات</div><div class="v">${m$(sales(m))}</div><div class="d">${delta(sales(m),sales(pm))}</div></div>
   <div class="card kpi" onclick="go('trade')"><div class="l">المشتريات</div><div class="v">${m$(purch(m))}</div><div class="d">${delta(purch(m),purch(pm),1)}</div></div>
   <div class="card kpi" onclick="go('exp',{month:'${m}'})"><div class="l">المصاريف</div><div class="v">${m$(expTotal(m))}</div><div class="d">${delta(expTotal(m),expTotal(pm),1)}</div></div>
   <div class="card kpi" onclick="go('pl')"><div class="l">صافي الربح</div><div class="v ${profit(m)<0?'dn':''}">${m$(profit(m))}</div><div class="d">${delta(profit(m),profit(pm))}</div></div>
  </div>
  <div class="two"><div class="card"><h3>آخر 6 شهور</h3>${chart()}</div>
   <div class="card"><h3>أعلى بنود الصرف — ${ml(m)}</h3>${cats.length?cats.map(c=>`<div style="margin-bottom:9px;cursor:pointer" onclick="catModal('${esc(c[0])}','${m}')"><div class="row" style="justify-content:space-between"><span>${c[0]}</span><b>${m$(c[1])}</b></div><div class="bar"><i style="width:${c[1]/mx*100}%"></i></div></div>`).join(''):'<p class="note">لا توجد مصاريف مسجلة هذا الشهر. أضفها من صفحة المصاريف.</p>'}</div></div>
  <div class="two"><div class="card"><h3>توقع السيولة (الالتزامات المؤكدة)</h3><table><tr><th>الشهر</th><th class="n">داخل</th><th class="n">خارج</th><th class="n">الصافي</th></tr>${next.map((x,i)=>{const inn=list('rec').filter(d=>d.due.slice(0,7)===x||(i===0&&d.due.slice(0,7)<x)).reduce((s,d)=>s+d.amount,0),out=list('pay').filter(d=>d.due.slice(0,7)===x||(i===0&&d.due.slice(0,7)<x)).reduce((s,d)=>s+d.amount,0)+(i?expTotal(x):0);return `<tr><td>${MN[+x.slice(5)-1]}</td><td class="n">${f(inn)}</td><td class="n">${f(out)}</td><td class="n ${inn-out<0?'dn':'up'}"><b>${f(inn-out)}</b></td></tr>`}).join('')}</table><p class="note">داخل: فواتير العملاء المستحقة. خارج: فواتير الموردين والمصاريف المتكررة. المبيعات الجديدة غير محسوبة.</p></div>
   <div class="card"><h3>نظرة سريعة</h3><table>
   <tr><td>عملاء عليهم مديونية</td><td class="n"><b>${new Set(list('rec').map(d=>d.who)).size}</b></td></tr>
   <tr><td>موردون لهم مستحقات</td><td class="n"><b>${new Set(list('pay').map(d=>d.who)).size}</b></td></tr>
   <tr><td>فواتير عملاء مفتوحة</td><td class="n"><b>${list('rec').length}</b></td></tr>
   <tr><td>فواتير موردين مفتوحة</td><td class="n"><b>${list('pay').length}</b></td></tr>
   <tr><td>صافي المركز (ليك − عليك)</td><td class="n"><b class="${tot('rec')-tot('pay')<0?'dn':'up'}">${m$(tot('rec')-tot('pay'))}</b></td></tr></table></div></div>`}

function pExp(){const m=S.month,opts=[...MONTHS,addM(CM,1),addM(CM,2),addM(CM,3)],it=expItems(m);
  return head('المصاريف',`<select style="width:auto" onchange="S.month=this.value;render()">${opts.map(x=>`<option value="${x}"${x===m?' selected':''}>${ml(x)}${x>CM?' (متوقع)':''}</option>`).join('')}</select><button class="btn ai" onclick="aiModal('exp','المصاريف')">تحليل AI</button><button class="btn p" onclick="expForm()">+ مصروف جديد</button>`)+
  `<div class="grid"><div class="card"><div class="note">إجمالي ${ml(m)}</div><b style="font-size:21px">${m$(expTotal(m))}</b></div>
  ${['fixed','temp','once'].map(t=>`<div class="card"><div class="note">${TYPE[t][0]}</div><b style="font-size:18px">${m$(it.filter(e=>e.type===t).reduce((s,e)=>s+(+e.amount),0))}</b></div>`).join('')}</div>
  <div class="card tw"><table><tr><th>البند</th><th>التصنيف</th><th>النوع</th><th>المدة</th><th class="n">المبلغ</th><th class="noprint"></th></tr>
  ${it.map(e=>{let d='مستمر من '+ml(e.start||CM),a=`<button class="btn sm" onclick="stopExp(${e.id})">إيقاف</button>`;
    if(e.type==='fixed'&&e.stop){d='ينتهي بنهاية '+ml(addM(e.stop,-1));a=''}
    if(e.type==='temp'){const r=remaining(e);d=`حتى ${ml(e.end)} | باقي ${r.n} دفعة (${m$(r.amount)})`;a=`<button class="btn sm" onclick="delExp(${e.id})">حذف</button>`}
    if(e.type==='once'){d=e.date;a=`<button class="btn sm" onclick="delExp(${e.id})">حذف</button>`}
    return `<tr><td>${esc(e.name)}</td><td>${esc(e.cat)}</td><td><span class="tag ${TYPE[e.type][1]}">${TYPE[e.type][0]}</span></td><td>${d}</td><td class="n"><b>${f(e.amount)}</b></td><td class="noprint">${a}</td></tr>`}).join('')||'<tr><td colspan="6">لا توجد مصاريف في هذا الشهر.</td></tr>'}
  </table></div><p class="note">المصاريف تُحفظ في البرنامج (مش في دفترة). الثابت والمؤقت يظهران في توقع السيولة تلقائيًا.</p>`}
function expForm(){modal(`<div class="top"><h3>مصروف جديد</h3><button class="btn" onclick="closeM()">إلغاء</button></div>
  <div class="form"><div><label>اسم البند</label><input id="en"></div><div><label>التصنيف</label><select id="ec">${D.cats.map(c=>`<option>${c}</option>`).join('')}</select></div>
  <div><label>المبلغ</label><input id="ea" type="number" min="1"></div>
  <div><label>النوع</label><select id="et" onchange="expFields()"><option value="fixed">ثابت يتكرر كل شهر</option><option value="temp">مؤقت بمدة وينتهي</option><option value="once">مرة واحدة</option></select></div>
  <div id="f1"></div><div id="f2"></div></div><div class="err" id="ee"></div><p><button class="btn p" id="esave" onclick="saveExp()">حفظ</button></p>`);expFields()}
function expFields(){const t=$('et').value;
  $('f1').innerHTML=t==='once'?`<label>التاريخ</label><input id="ed" type="date" value="${D.today}">`:`<label>يبدأ من شهر</label><input id="es" type="month" value="${CM}">`;
  $('f2').innerHTML=t==='temp'?`<label>آخر شهر</label><input id="ex" type="month" value="${addM(CM,5)}">`:''}
async function saveExp(){const b={name:$('en').value,cat:$('ec').value,amount:$('ea').value,type:$('et').value};
  if(b.type==='once')b.date=$('ed').value;else{b.start=$('es').value;if(b.type==='temp')b.end=$('ex').value}
  $('esave').disabled=true;
  try{await api('/api/expenses',{method:'POST',body:JSON.stringify(b)});if(b.type==='once')S.month=b.date.slice(0,7);else S.month=b.start;await loadData();closeM();render()}
  catch(e){$('ee').textContent=e.message;$('esave').disabled=false}}
async function stopExp(id){await api('/api/expenses/'+id+'/stop',{method:'POST',body:JSON.stringify({from:addM(S.month>CM?S.month:CM,1)})});await loadData();render()}
async function delExp(id){if(!confirm('حذف هذا المصروف؟'))return;await api('/api/expenses/'+id,{method:'DELETE'});await loadData();render()}
function catModal(c,m){const items=expItems(m).filter(e=>e.cat===c);modal(`<div class="top"><h3>${esc(c)} — ${ml(m)}</h3><button class="btn" onclick="closeM()">إغلاق</button></div><table>${items.map(e=>`<tr><td>${esc(e.name)}</td><td><span class="tag ${TYPE[e.type][1]}">${TYPE[e.type][0]}</span></td><td class="n"><b>${m$(e.amount)}</b></td></tr>`).join('')||'<tr><td>لا يوجد.</td></tr>'}</table><p class="note">متوسط آخر 3 شهور قبله: ${m$([1,2,3].reduce((s,k)=>s+catTotal(addM(m,-k),c),0)/3)}</p>`)}

function debtRows(k,rows){return rows.map(d=>{const s=st(d),l=late(d),p=who(k,d.who);return `<tr class="s${s}"><td>${esc(p.name||d.name)}</td><td>${esc(d.inv)}</td><td>${d.due}</td><td><span class="tag ${s}">${l>0?'متأخر '+l+' يوم':l===0?'مستحق اليوم':'باقي '+(-l)+' يوم'}</span></td><td class="n"><b>${f(d.amount)}</b></td>${k==='rec'?`<td class="noprint"><button class="btn sm" onclick="remind('${esc(d.inv)}')">تذكير واتساب</button></td>`:'<td></td>'}</tr>`}).join('')}
function pDebt(k){const isR=k==='rec',F=isR?S.recF:S.payF,tab=isR?S.recTab:S.payTab,title=isR?'العملاء':'الموردين';
  const tabs=`<div class="row noprint" style="margin-bottom:12px"><button class="chip ${tab==='debts'?'on':''}" onclick="go('${k}',{${k}Tab:'debts'})">${isR?'تقرير المديونيات':'تقرير المستحقات'}</button><button class="chip ${tab==='list'?'on':''}" onclick="go('${k}',{${k}Tab:'list'})">قائمة ${title}</button></div>`;
  if(tab==='list'){return head(title,`<button class="btn" onclick="doSync(this)">تحديث من دفترة</button>`)+tabs+`<div class="card tw"><table><tr><th>الاسم</th><th>الهاتف</th><th class="n">فواتير مفتوحة</th><th class="n">الرصيد</th><th>الحالة</th><th></th></tr>
   ${people(k).map(p=>{const ds=list(k).filter(d=>String(d.who)===String(p.id)),w=ds.some(d=>st(d)==='r')?'r':ds.some(d=>st(d)==='y')?'y':'g';return `<tr class="click" onclick="statement('${k}','${esc(String(p.id))}')"><td><b>${esc(p.name)}</b></td><td dir="ltr" style="text-align:right">${esc(p.phone||'—')}</td><td class="n">${ds.length}</td><td class="n"><b>${f(bal(k,p.id))}</b></td><td>${ds.length?`<span class="tag ${w}">${STL[w]}</span>`:'<span class="note">لا رصيد</span>'}</td><td><button class="btn sm">كشف حساب</button></td></tr>`}).join('')||'<tr><td colspan="6">لا توجد بيانات. اضغط تحديث من دفترة.</td></tr>'}</table></div>`}
  let rows=[...list(k)].sort((a,b)=>a.due<b.due?-1:1);if(F==='month')rows=rows.filter(d=>d.due.slice(0,7)<=CM);else if(F!=='all')rows=rows.filter(d=>st(d)===F);
  const chip=(v,t)=>`<button class="chip ${F===v?'on':''}" onclick="go('${k}',{${k}F:'${v}'})">${t}</button>`;
  return head(title,`<button class="btn ai" onclick="aiModal('${k}','${title}')">تحليل AI</button><button class="btn" onclick="doSync(this)">تحديث</button><button class="btn p" onclick="pdf('${k}')">تقرير PDF</button>`)+tabs+
  `<div class="grid">${['r','y','g'].map(s=>`<div class="card kpi" onclick="go('${k}',{${k}F:'${s}'})"><span class="tag ${s}">${STL[s]}</span><div class="v">${m$(tot(k,s))}</div><div class="note">${list(k).filter(d=>st(d)===s).length} فاتورة</div></div>`).join('')}
   <div class="card kpi" onclick="go('${k}',{${k}F:'all'})"><div class="l">${isR?'إجمالي المطلوب تحصيله':'إجمالي المطلوب سداده'}</div><div class="v">${m$(tot(k))}</div><div class="note">${list(k).length} فاتورة</div></div></div>
  <div class="row noprint" style="margin-bottom:10px">${chip('all','الكل')}${chip('month','المستحق حتى نهاية الشهر')}${chip('r','أحمر')}${chip('y','أصفر')}${chip('g','أخضر')}</div>
  <div class="card tw"><table><tr><th>${isR?'العميل':'المورد'}</th><th>الفاتورة</th><th>تاريخ الاستحقاق</th><th>الحالة</th><th class="n">المبلغ</th><th class="noprint"></th></tr>${debtRows(k,rows)||'<tr><td colspan="6">لا توجد فواتير بهذا التصنيف.</td></tr>'}
  <tr><td colspan="4"><b>الإجمالي</b></td><td class="n"><b>${f(rows.reduce((s,d)=>s+d.amount,0))}</b></td><td></td></tr></table></div>`}
function statement(k,id){const p=who(k,id),rows=list(k).filter(d=>String(d.who)===String(id));
  modal(`<div class="top"><h3>كشف حساب: ${esc(p.name)}</h3><div class="row noprint"><button class="btn p" onclick="printM()">PDF</button><button class="btn" onclick="closeM()">إغلاق</button></div></div>
  <p class="note">بتاريخ ${D.today} | الهاتف: <span dir="ltr">${esc(p.phone||'—')}</span></p>
  ${rows.length?`<table><tr><th>${k==='rec'?'العميل':'المورد'}</th><th>الفاتورة</th><th>الاستحقاق</th><th>الحالة</th><th class="n">المبلغ</th><th></th></tr>${debtRows(k,rows)}<tr><td colspan="4"><b>الرصيد</b></td><td class="n"><b>${m$(bal(k,id))}</b></td><td></td></tr></table>`:'<p>لا يوجد رصيد مفتوح.</p>'}`)}
function pdf(k){const isR=k==='rec',rows=[...list(k)].sort((a,b)=>a.due<b.due?-1:1);
  modal(`<div class="top"><h3>${isR?'تقرير مديونيات العملاء':'تقرير مستحقات الموردين'}</h3><div class="row noprint"><button class="btn p" onclick="printM()">طباعة / حفظ PDF</button><button class="btn" onclick="closeM()">إغلاق</button></div></div>
  <p class="note">Elite Skin — بتاريخ ${D.today}</p>
  <div class="row" style="margin-bottom:10px">${['r','y','g'].map(s=>`<span class="tag ${s}">${STL[s]}: ${m$(tot(k,s))}</span>`).join('')}</div>
  <table><tr><th>${isR?'العميل':'المورد'}</th><th>الفاتورة</th><th>الاستحقاق</th><th>الحالة</th><th class="n">المبلغ</th><th></th></tr>${debtRows(k,rows)||'<tr><td colspan=6>لا يوجد.</td></tr>'}<tr><td colspan="4"><b>الإجمالي</b></td><td class="n"><b>${m$(tot(k))}</b></td><td></td></tr></table>`)}
function printM(){document.body.classList.add('printing');try{window.print()}catch(e){}setTimeout(()=>document.body.classList.remove('printing'),600)}
function remind(inv){const d=list('rec').find(x=>x.inv===inv);if(!d)return;const p=who('rec',d.who),l=late(d);
  const msg=`السلام عليكم ${p.name}،\nنذكّر حضرتك بالفاتورة رقم ${d.inv} بمبلغ ${m$(d.amount)}، ${l>0?'وكان موعد استحقاقها '+d.due:'وموعد استحقاقها '+d.due}.\nنرجو التكرم بالسداد، وشكرًا لتعاونكم.\nElite Skin`;
  const phone=(p.phone||'').replace(/[^0-9]/g,''),wa=phone?`https://wa.me/${phone.replace(/^0/,'20')}?text=${encodeURIComponent(msg)}`:'';
  modal(`<div class="top"><h3>رسالة تذكير</h3><button class="btn" onclick="closeM()">إغلاق</button></div><p class="note">إلى: ${esc(p.name)} <span dir="ltr">${esc(p.phone||'—')}</span></p><div class="card" style="white-space:pre-wrap" id="msg">${esc(msg)}</div><p class="row"><button class="btn p" onclick="copyMsg(this)">نسخ الرسالة</button>${wa?`<a class="btn ai" href="${wa}" target="_blank" rel="noopener">فتح واتساب</a>`:'<span class="note">رقم الهاتف غير مسجل لهذا العميل في دفترة.</span>'}</p><p class="note">تأكد من الرسالة قبل الإرسال.</p>`)}
function copyMsg(b){try{navigator.clipboard.writeText($('msg').textContent).then(()=>b.textContent='تم النسخ',()=>b.textContent='انسخها يدويًا')}catch(e){b.textContent='انسخها يدويًا'}}

function pTrade(){return head('البيع والشراء',`<button class="btn ai" onclick="aiModal('trade','البيع والشراء')">تحليل AI</button>`)+statusBanner()+
  `<div class="card tw"><h3>شهريًا (من فواتير دفترة)</h3><table><tr><th>الشهر</th><th class="n">المبيعات</th><th class="n">المشتريات</th><th class="n">مجمل الربح</th><th class="n">نسبة المشتريات</th></tr>${MONTHS.map(m=>`<tr><td>${ml(m)}</td><td class="n">${f(sales(m))}</td><td class="n">${f(purch(m))}</td><td class="n"><b>${f(sales(m)-purch(m))}</b></td><td class="n">${sales(m)?(purch(m)/sales(m)*100).toFixed(1):'0'}%</td></tr>`).join('')}</table><p class="note">المبيعات = إجمالي فواتير البيع، المشتريات = إجمالي فواتير الشراء، لكل شهر حسب تاريخ الفاتورة.</p></div>`}

function pPL(){const row=(t,fn,b,cls)=>`<tr${cls?' class="click" onclick="catModal(\''+esc(t)+'\',\''+CM+'\')"':''}><td>${b?'<b>'+t+'</b>':t}</td>${MONTHS.map(m=>{const v=fn(m);return `<td class="n ${cls&&v<0?'dn':''}">${b?'<b>'+f(v)+'</b>':f(v)}</td>`}).join('')}</tr>`;
  return head('الربح والخسارة',`<button class="btn ai" onclick="aiModal('pl','الربح والخسارة')">تحليل AI</button><button class="btn p" onclick="printM()">PDF</button>`)+
  `<div class="card tw"><table><tr><th></th>${MONTHS.map(m=>`<th class="n">${ml(m)}</th>`).join('')}</tr>
  ${row('المبيعات',sales)}${row('المشتريات',m=>-purch(m))}${row('مجمل الربح',m=>sales(m)-purch(m),1)}
  ${D.cats.filter(c=>MONTHS.some(m=>catTotal(m,c))).map(c=>`<tr class="click" onclick="catModal('${esc(c)}','${CM}')"><td>${esc(c)}</td>${MONTHS.map(m=>{const v=catTotal(m,c),pv=catTotal(addM(m,-1),c);return `<td class="n ${m!==MONTHS[0]&&pv&&v>pv*1.15?'dn':''}">${f(v)}</td>`}).join('')}</tr>`).join('')}
  ${row('إجمالي المصاريف',expTotal,1)}${row('صافي الربح',profit,1,1)}
  <tr><td>هامش صافي الربح</td>${MONTHS.map(m=>`<td class="n">${sales(m)?(profit(m)/sales(m)*100).toFixed(1):'0'}%</td>`).join('')}</tr></table>
  <p class="note">الأرقام الحمراء في البنود: زيادة أكثر من 15% عن الشهر السابق. اضغط أي بند لتفاصيله.</p></div>`}

function pAI(){const qs=['فين المصاريف زادت؟','إزاي أزوّد الربح؟','مين العملاء المتأخرين؟','وضع الموردين إيه؟','إيه اللي يقلقني الشهر ده؟'];
  return head('المساعد الذكي')+statusBanner()+`<div class="card"><div class="chat">${S.chat.map(c=>`<div class="q">${esc(c.q)}</div>${c.a}`).join('')||'<p class="note">اسأل عن أي حاجة في حساباتك، أو اختار سؤال جاهز. التحليل مبني على بياناتك الحقيقية من دفترة.</p>'}</div>
  <div class="row" style="margin-bottom:10px">${qs.map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join('')}</div>
  <div class="row"><input id="q" style="flex:1;width:auto" placeholder="اكتب سؤالك..." onkeydown="if(event.key==='Enter')ask()"><button class="btn ai" onclick="ask()">اسأل</button></div>
  ${D.aiConfigured?'':'<p class="note">ملاحظة: الذكاء الاصطناعي غير مفعّل. أضف ANTHROPIC_API_KEY في .env لتفعيل التحليل الكامل؛ حاليًا يعمل بقواعد ثابتة.</p>'}</div>`}

/* الإعدادات */
let SET=null;
async function pSettings(){
  return head('الإعدادات')+`<div id="setwrap"><p class="note"><span class="spin"></span> تحميل...</p></div>`;
}
async function loadSettings(){try{SET=await api('/api/settings');renderSettings()}catch(e){const w=$('setwrap');if(w)w.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function renderSettings(){const w=$('setwrap');if(!w)return;const s=SET;
  w.innerHTML=`
  <div class="card" style="max-width:620px">
    <h3>ربط دفترة (Daftra)</h3>
    <p class="note">المفتاح من دفترة: الإعدادات ← مفاتيح الـ API (API Keys). البرنامج يقرأ فقط ولا يعدّل في دفترة.</p>
    <div class="form" style="grid-template-columns:1fr">
      <div><label>الساب دومين (اسم حسابك في دفترة)</label><input id="s_sub" value="${esc(s.daftraSubdomain)}" placeholder="مثال: eliteskin"><div class="note">لو حسابك https://eliteskin.daftara.com اكتب eliteskin فقط.</div></div>
      <div><label>النطاق</label><select id="s_dom"><option value="daftara.com"${s.daftraDomain==='daftara.com'?' selected':''}>daftara.com</option><option value="daftra.com"${s.daftraDomain==='daftra.com'?' selected':''}>daftra.com</option></select></div>
      <div><label>مفتاح الـ API ${s.daftraApikeySet?'<span class="tag g">محفوظ</span>':'<span class="tag r">غير محفوظ</span>'}</label><input id="s_key" type="password" placeholder="${s.daftraApikeySet?'••••••• (اكتب مفتاحًا جديدًا للتغيير)':'الصق المفتاح هنا'}"></div>
      <div><label>مزامنة تلقائية كل (دقيقة)</label><input id="s_sync" type="number" min="5" value="${s.syncEveryMinutes}"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn p" id="s_save" onclick="saveSettings()">حفظ</button><button class="btn" id="s_test" onclick="testDaftra()">اختبار الاتصال</button>${s.daftraApikeySet?'<button class="btn sm" onclick="clearKey(\'daftra\')">حذف المفتاح</button>':''}</div>
    <div id="s_msg" style="margin-top:8px"></div>
  </div>
  <div class="card" style="max-width:620px;margin-top:12px">
    <h3>ربط الذكاء الاصطناعي (AI)</h3>
    <p class="note">مفتاح Anthropic لتفعيل التحليلات والاقتراحات الذكية الكاملة. من console.anthropic.com. بدونه يعمل المساعد بقواعد ثابتة.</p>
    <div class="form" style="grid-template-columns:1fr">
      <div><label>مفتاح Anthropic ${s.anthropicKeySet?'<span class="tag g">محفوظ ومفعّل</span>':'<span class="tag y">غير مفعّل</span>'}</label><input id="s_ai" type="password" placeholder="${s.anthropicKeySet?'••••••• (اكتب مفتاحًا جديدًا للتغيير)':'sk-ant-...'}"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn p" id="s_aisave" onclick="saveAI()">حفظ مفتاح الـ AI</button>${s.anthropicKeySet?'<button class="btn sm" onclick="clearKey(\'ai\')">حذف المفتاح</button>':''}</div>
    <div id="s_aimsg" style="margin-top:8px"></div>
  </div>`;
}
async function saveSettings(){const btn=$('s_save');btn.disabled=true;const msg=$('s_msg');msg.innerHTML='<span class="spin"></span> جاري الحفظ والمزامنة...';
  try{const body={daftraSubdomain:$('s_sub').value,daftraDomain:$('s_dom').value,syncEveryMinutes:$('s_sync').value};const k=$('s_key').value.trim();if(k)body.daftraApikey=k;
    const r=await api('/api/settings',{method:'POST',body:JSON.stringify(body)});
    await loadData();
    if(r.sync&&!r.sync.ok)msg.innerHTML=`<span class="banner warn" style="display:inline-block">حُفظ، لكن تعذّرت المزامنة: ${esc(r.sync.error)}</span>`;
    else if(r.sync&&r.sync.ok)msg.innerHTML=`<span class="banner ok" style="display:inline-block">تم الحفظ والمزامنة: ${r.sync.counts.clients} عميل، ${r.sync.counts.suppliers} مورد، ${r.sync.counts.invoices} فاتورة بيع.</span>`;
    else msg.innerHTML='<span class="banner info" style="display:inline-block">تم الحفظ.</span>';
    await loadSettings();
  }catch(e){msg.innerHTML=`<span class="err">${esc(e.message)}</span>`;btn.disabled=false}}
async function testDaftra(){const btn=$('s_test');btn.disabled=true;const msg=$('s_msg');msg.innerHTML='<span class="spin"></span> جاري الاختبار...';
  // نحفظ أولًا لو فيه مفتاح جديد مكتوب
  const k=$('s_key').value.trim();if(k||$('s_sub').value!==SET.daftraSubdomain){try{const body={daftraSubdomain:$('s_sub').value,daftraDomain:$('s_dom').value};if(k)body.daftraApikey=k;await api('/api/settings',{method:'POST',body:JSON.stringify(body)});await loadSettings()}catch(e){}}
  try{const r=await api('/api/daftra/test',{method:'POST'});msg.innerHTML=r.ok?`<span class="banner ok" style="display:inline-block">${esc(r.message)}</span>`:`<span class="banner warn" style="display:inline-block">${esc(r.error)}</span>`}
  catch(e){msg.innerHTML=`<span class="err">${esc(e.message)}</span>`}btn.disabled=false}
async function saveAI(){const btn=$('s_aisave');btn.disabled=true;const msg=$('s_aimsg');const k=$('s_ai').value.trim();
  if(!k){msg.innerHTML='<span class="err">اكتب المفتاح أولًا.</span>';btn.disabled=false;return}
  msg.innerHTML='<span class="spin"></span> جاري الحفظ...';
  try{await api('/api/settings',{method:'POST',body:JSON.stringify({anthropicKey:k})});await loadData();msg.innerHTML='<span class="banner ok" style="display:inline-block">تم تفعيل الذكاء الاصطناعي.</span>';await loadSettings()}
  catch(e){msg.innerHTML=`<span class="err">${esc(e.message)}</span>`;btn.disabled=false}}
async function clearKey(which){if(!confirm('حذف المفتاح؟'))return;const body=which==='daftra'?{clearDaftraKey:true}:{clearAnthropicKey:true};await api('/api/settings',{method:'POST',body:JSON.stringify(body)});await loadData();await loadSettings()}

async function doSync(btn){if(btn){btn.disabled=true;btn.textContent='جاري التحديث...'}
  try{const r=await api('/api/sync',{method:'POST'});await loadData();render();if(!r.ok)alert('تعذّرت المزامنة: '+r.error)}
  catch(e){alert(e.message)}}

function modal(h){$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="mod">${h}</div></div>`}
function closeM(){$('modal').innerHTML=''}
function render(){$('root').innerHTML=`<div class="app"><aside class="side"><h1>المتابعة المالية</h1><small>Elite Skin</small><div id="nav"></div><div class="foot"><button class="nav" onclick="logout()">خروج</button></div></aside><main class="main"><div class="page" id="page"></div></main></div>`;
  $('nav').innerHTML=PAGES.map(p=>`<button class="nav ${S.page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');
  const R={dash:pDash,exp:pExp,rec:()=>pDebt('rec'),pay:()=>pDebt('pay'),trade:pTrade,pl:pPL,ai:pAI,settings:pSettings};
  const out=R[S.page]();
  if(out&&typeof out.then==='function'){out.then(h=>{$('page').innerHTML=h;if(S.page==='settings')loadSettings()})}
  else $('page').innerHTML=out}

async function logout(){await api('/api/logout',{method:'POST'});location.reload()}

function loginScreen(err){$('root').innerHTML=`<div class="login"><h1>المتابعة المالية</h1><p>Elite Skin — تسجيل الدخول</p>
  <label>كلمة المرور</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="le">${err||''}</div><p><button class="btn p" style="width:100%" id="lb" onclick="doLogin()">دخول</button></p></div>`;const el=$('pw');if(el)el.focus()}
async function doLogin(){$('lb').disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
  if(r.ok){await boot()}else{const j=await r.json().catch(()=>({}));loginScreen(j.error||'فشل الدخول')}}catch(e){loginScreen(e.message)}}

async function boot(){try{const me=await (await fetch('/api/me')).json();if(!me.authed){loginScreen();return}await loadData();render()}catch(e){loginScreen(e.message)}}
boot();
</script>
</body>
