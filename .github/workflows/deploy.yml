name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The SSH key used here is restricted server-side (forced command) to
      # only ever run /opt/elite-crm/scripts/auto-deploy.sh, regardless of
      # what is requested here — so the exact command below is irrelevant,
      # but it documents the intent.
      - name: Trigger deploy on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/elite-crm/scripts/auto-deploy.sh
