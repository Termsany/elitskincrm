name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_SSH_KEY_B64 is the private key base64-encoded as one line —
      # multi-line secrets are easy to corrupt via copy/paste, a single
      # line is not. The key is restricted server-side (forced command in
      # authorized_keys) to only ever run auto-deploy.sh regardless of what
      # is requested here.
      - name: Trigger deploy on the VPS
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -v -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "root@${DEPLOY_HOST}" "/opt/elite-crm/scripts/auto-deploy.sh"
